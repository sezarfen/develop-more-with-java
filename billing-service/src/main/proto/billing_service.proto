syntax = "proto3";

option java_multiple_files = true;
option java_package = "billing";

// rpc method CreateBillingAccount will accept BillingRequest as a attribute
service BillingService {
  rpc CreateBillingAccount (BillingRequest) returns (BillingResponse);
}

// dto olarak düşünebiliriz, propteryleri yazıyoruz
message BillingRequest {
  string patientId = 1; // buradaki sayının unique olması lazım gRPC'e farklı propertyleri söylemek için
  string name = 2;
  string email = 3;
}

message BillingResponse {
  string accountId = 1;
  string status = 2;
}